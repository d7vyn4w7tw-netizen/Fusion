<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FredOS Launcher</title>
<style>
html,body{margin:0;background:#0E1216;color:#EAE5DB;font-family:system-ui,-apple-system,sans-serif;min-height:100%}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.card{max-width:520px;border:1px solid #28323B;border-radius:16px;padding:24px;background:#161B21}
h1{margin:0 0 8px;font-size:26px}.muted{color:#9099A4;font-size:14px;line-height:1.5}
a{display:inline-block;margin-top:16px;padding:12px 16px;border-radius:10px;background:#4C8DFF;color:#07121F;font-weight:800;text-decoration:none}
.small{margin-top:12px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#6F7B86}
</style>
<script>
(function(){
  var target = './fredos5701.html';
  // Use replace so the launcher itself does not remain in the back stack.
  try { location.replace(target); } catch(e) { location.href = target; }
})();
</script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>FredOS V5.7</h1>
    <div class="muted">Opening immutable Build 5701…</div>
    <a href="./fredos5701.html">Open FredOS V5.7</a>
    <div class="small">launcher → fredos5701.html</div>
  </div>
</div>
</body>
</html>
